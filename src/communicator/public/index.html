<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEDCOM</title><link rel="stylesheet" href="/styles.css"><script type="module" src="/app.js"></script><script type="module" src="/chat-entry.js"></script></head><body>
<a class="skip" href="#chat">Skip to chat</a><header><strong>NEDCOM</strong><small>Local · Hermes</small><label class="mobile-menu" for="mobile-view">View<select id="mobile-view"><option value="chat">Chat</option><option value="project">Project</option></select></label></header>
<div class="shell" data-view="chat"><aside><label for="project">Project</label><select id="project" disabled><option value="">Loading projects…</option></select><nav aria-label="Project sections"><button data-section="Tasks" disabled>Tasks</button><button data-section="Artifacts" disabled>Artifacts</button><button data-section="WIP app" disabled>WIP app</button></nav><p id="navigation-hint">Choose a project first.</p></aside>
<section id="chat" class="chat-pane" aria-labelledby="chat-heading" tabindex="-1"><h1 id="chat-heading">Chat</h1><div class="chat-toolbar"><label for="sessions">Session</label><select id="sessions"><option value="">Choose a session</option></select><button id="new-chat">New chat</button><button id="more-sessions" hidden>Load more sessions</button></div><div class="history-controls"><button id="older" hidden>Load older</button><button id="newer" hidden>Load newer</button><button id="latest" hidden>Latest</button></div><div id="transcript" class="transcript" role="region" aria-label="Conversation" tabindex="0"></div><p id="chat-status" role="status" aria-live="polite">Loading chat…</p><button id="chat-retry">Reload</button><form id="chat-form"><label for="chat-message">Message</label><textarea id="chat-message" rows="3" maxlength="8000" required></textarea><button id="chat-send" type="submit">Send</button></form></section>
<main id="content" tabindex="-1"><div id="identity" class="eyebrow"></div><h2 id="heading" tabindex="-1">Loading projects…</h2><section class="card" id="card"><p id="message"></p><a id="open-app" class="app-link" target="_blank" rel="noopener noreferrer" aria-label="Open app (opens in a new tab)" hidden>Open app</a><small id="new-tab-note" hidden> Opens in a new tab.</small><button id="retry" hidden>Retry</button></section><p id="announcement" role="status" aria-live="polite" class="sr-only"></p></main></div>
</body></html>
