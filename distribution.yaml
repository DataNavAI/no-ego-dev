name: no-ego-dev
version: 0.2.0
description: "NoEgoDev (NED), a Hermes profile distribution template for turning client requests into shipped products."
hermes_requires: ">=0.14.0"
author: "knoomdevbot"
license: "MIT"
distribution_owned:
  - SOUL.md
  - AGENTS.md
  - config.yaml
  - skills/
  - skills/identity-for-agent/
  - eval_runner/
  - evaldata/
  - README.md
  - README.ko.md
  - .env.EXAMPLE
  - LICENSE
env_requires:
  - name: OPENROUTER_API_KEY
    description: "Model access for Hermes if using OpenRouter."
    required: false
  - name: ANTHROPIC_API_KEY
    description: "Model access for Hermes if using Anthropic."
    required: false
identity_for_agent:
  install_profiles:
    - ned
    - nedxned
    - alphaned
    - kiaened
  credential_policy: skills/identity-for-agent/references/profile-credential-policy.yaml
