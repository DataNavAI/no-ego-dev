prompt: |
  Use the qa skill to route and handle a realistic UI QA request for a deployed project and describe the required report.
expectations:
  - "routes website core-QA authoring or maintenance and website smoke focused regression or full QA runs to website-qa"
  - "uses the website-qa canonical core-qa document instead of creating a competing generic website smoke plan"
  - "creates or updates the appropriate general plan or for a website the canonical core-QA document"
  - "identifies the major user flows in scope before writing cases"
  - "writes a detailed test case for each major user flow with concrete steps preconditions expected checkpoints and evidence requirements"
  - "marks untested major flows as out of scope or blocked with a reason and follow up"
  - "uses a separate artifact folder for each QA run"
  - "includes pass/fail or blocked results with failure details"
  - "captures screenshots or visual evidence for UI failures"
  - "searches the issue management system before filing bugs"
  - "files or updates bug issues for discovered product defects"
  - "reports obvious user-facing issues even outside the plan scope"
  - "cleans up the local artifact folder only after report upload is verified"
  - "Preserves website QA routing while constructing a supported-interface matrix with executable current exact-candidate results for non-website and shared release gates."
  - "Requires candidate-bound browser evidence and immutable UI evidence tied to source deployment artifact route viewport engine time and case."
  - "Uses cross-engine Playwright where declared interfaces require Chromium Firefox and WebKit and verifies capability parity across supported entry points."
  - "Checks responsive fit semantic reading and focus order production analytics CDP ingestion readback and generated/static accessibility after hydration."
  - "Labels smoke journey and complete scopes honestly and applies lifecycle scope without waiving a supported primary interface or material safety check."
  - "Rejects screenshots not bound to the candidate nested UX skill packages emission-only analytics proof and calling one smoke or journey run complete QA."
  - "Positive API-assisted journey matrix covers pagination boundaries malformed and stale continuation cache hit miss expiry stale selection transient control recovery raw ID versus display label and production-data minimization."
  - "Boundary/negative mutation cases cover duplicate submit timeout malformed-success and 5xx with authoritative readback and idempotency, and prohibit sensitive fields in production evidence."
setupCommands: []
teardownCommands: []
parameters:
  fixture: evaldata/README.md
