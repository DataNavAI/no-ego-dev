name: product-bootstrap
prompt: |
  Bootstrap a small publishable prototype from BENCHMARK.md. Adapt the benchmark pattern for independent dog walkers who need a simple client intake flow. Use the existing starter app in this repository; keep the implementation simple and verify it.
expectations:
  - "inspects BENCHMARK.md and starter app before editing"
  - "creates or updates durable frontend prototype files for a clear adapted client intake flow"
  - "keeps the benchmark pattern without copying benchmark-specific branding or text"
  - "runs a deterministic build, test, or smoke check and reports the exact command/result"
  - "does not leave scratch notes or temporary artifacts in the repository"
setupCommands:
  - "rm -rf /tmp/no-ego-dev-product-bootstrap-skill-eval && git clone --branch eval/product-bootstrap-benchmark --single-branch https://github.com/knoomdevbot/no-ego-dev-test-app.git /tmp/no-ego-dev-product-bootstrap-skill-eval"
teardownCommands:
  - "rm -rf /tmp/no-ego-dev-product-bootstrap-skill-eval"
parameters:
  repository: "https://github.com/knoomdevbot/no-ego-dev-test-app.git"
  branch: "eval/product-bootstrap-benchmark"
  working_directory: "/tmp/no-ego-dev-product-bootstrap-skill-eval"
  benchmark: "BENCHMARK.md"
  expected_artifacts:
    - "updated frontend source or equivalent UI files"
    - "updated styles"
    - "test/build/smoke evidence"
