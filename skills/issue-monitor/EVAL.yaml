prompt: A scheduled issue monitor finds one owned issue with a linked draft PR and green exact-source CI. No separate
  review was requested. A previous agent reported a reproducible material defect. Explain how to reproduce and fix
  it, rerun affected checks, self-review, deliver under existing authority and read back the merged state. Do not
  create a duplicate issue, PR or review attempt.
expectations:
- Uses self-review and appropriate automated checks by default, without dispatching a reviewer or waiting for independent
  approval.
- Uses a separate review only when the user explicitly requests it; never adds review-round or approval-receipt
  ceremony to ordinary work.
- Preserves user authorization, actual test/provider checks, secret protection and truthful completion evidence.
- Reuses the canonical issue and existing PR under the concurrency limit.
- Material reproducible defects remain blockers until fixed and verified.
- Reconciles durable source and CI state before uncertain mutation retries.
- Does not wait for a reviewer verdict or merge-only reviewer executor.
setupCommands: []
teardownCommands: []
