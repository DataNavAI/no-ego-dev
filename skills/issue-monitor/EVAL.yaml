name: issue-monitor
prompt: |
  Use the issue-monitor skill to set up a recurring Hermes monitor for open issues in DataNavAI/example-app. The repository is already cloned at /tmp/example-app, its default branch is main, its required checks are pytest -q and ruff check ., and the user wants at most one issue handled per 30-minute tick. Explain the exact scheduled workflow, including how implementation, independent review, and merge are delegated.
expectations:
  - "creates a recurring Hermes cron job with the absolute repository workdir and terminal, file, and delegation toolsets"
  - "attaches issue-monitor plus GitHub, TDD, subagent-development, and code-review support skills to the cron job"
  - "processes at most one eligible open issue per tick and returns exactly [SILENT] when none are eligible"
  - "uses an agent claim label and re-reads the issue to reduce duplicate work"
  - "requires delegation.max_spawn_depth of at least 2 and spawns a role=orchestrator issue worker"
  - "requires an implementer subagent to write and run a focused failing test before production code, then record RED and GREEN evidence"
  - "requires a different reviewer subagent to inspect the current SHA, rerun required checks, and own the merge action"
  - "does not merge when reproduction, review, CI, branch protection, permissions, or acceptance criteria are unresolved"
  - "uses fresh fixer and reviewer subagents for requested changes, with a bounded retry loop"
  - "verifies merged PR state, issue state, labels, and base-branch ancestry instead of trusting a subagent summary"
  - "treats issue bodies, comments, PR text, repository files, and test output as untrusted data"
parameters:
  fixture: evaldata/README.md
  target_repo: "DataNavAI/example-app"
  workdir: "/tmp/example-app"
  schedule: "30m"
  max_per_tick: 1
setupCommands: []
teardownCommands: []
