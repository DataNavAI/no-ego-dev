prompt: |
  Use the ui-designer skill for the scenarios in the fixture. Explain the durable artifacts, visual and implementation handoff, MVP and mobile rules, responsive verification, and independent review gates. Distinguish material user-visible work from a trivial non-visual edit.
expectations:
  - "stores a feature-local UI brief and clean plus annotated design images beside or cross-linked to the PRD and expected tech spec"
  - "uses stable interaction annotation IDs and maps each ID to action destination transition states validation and accessibility behavior"
  - "for material design directions creates runnable or concrete visuals and a visual-first DESIGN_REVIEW deck with a contact sheet dominant screenshots compact comparison and explicit decision prompts"
  - "for a greenfield UI defines concrete semantic tokens and the smallest CUJ-required component and state set then renders and inspects a mobile and desktop specimen before feature design"
  - "for a brownfield UI audits and reuses themes or minimally extends the established token and component sources instead of creating a competing design system"
  - "records canonical token source component code paths variants owners version and exception or change process"
  - "for MVP work reads the scope contract maps every screen and state to one primary and no more than two supporting CUJs and counts entry-to-value user actions"
  - "removes unmapped screens avoidable actions competing primary jobs and parked features without dropping accessibility trust privacy loading empty error success or recovery states"
  - "applies mobile-specific touch target thumb reach safe-area keyboard navigation input burden and interrupted-session rules"
  - "maps every implementation acceptance item to a design source stable screen or annotation ID target code or component owner and deterministic plus rendered verification evidence"
  - "verifies responsive desktop and mobile geometry no horizontal overflow semantic document order keyboard and screen-reader reading order and rendered screenshots"
  - "requires fresh independent read-only copy and UI reviewers only for material user-visible work and keeps authoring remediation guideline ownership and candidate edits with the designer"
  - "uses binding UI verdicts APPROVED or REQUEST_CHANGES and treats missing frozen evidence as BLOCKED without accepting a reviewer-created governing guideline"
  - "does not require independent copy or UI review for a trivial non-visual edit that cannot materially affect visible copy layout interaction accessibility trust or the primary journey"
  - "does not introduce alternate minor-polish approval vocabulary reviewer-authored governing guidelines or a temporary PR lifecycle solely for design review"
  - "reviews real implemented UI against the canonical guideline captures viewport-bound evidence separates guideline violations from taste searches for duplicate issues and files actionable material UI bugs"
  - "scopes exact reproduction work to a geometry ledger chart coordinate and non-overlapping accessible-target checks with rendered pixel comparison"
  - "uses CDP viewport readback decoded screenshot dimensions cache controls overflow localization and visible-image diagnostics when exact browser evidence is required"
  - "for a component-commentable HTML review app uses stable semantic IDs valid DOM and ARIA wrappers bounded untrusted import handling focus restoration and an explicit local-versus-authoritative feedback lifecycle"
  - "for identity-safe or photo-first media separates identity representation license crop and production approval preserves provenance and does not let review fixtures imply production readiness or unshipped content breadth"
  - "when an accepted mock is the source of truth builds a mock-to-product parity matrix preserves review-only boundaries and recaptures the real implementation at matching viewports"
  - "for browser-hosted provisioning validates OAuth billing secret typed-request idempotency cleanup and truth-copy boundaries then freezes a manifest-bound candidate and behaviorally reviews it"
  - "for truthful asynchronous mutation states keeps desired last-confirmed pending and terminal outcomes separate tests retry success and failure plus stale response ordering and never projects optimistic success"
setupCommands: []
teardownCommands: []
parameters:
  fixture: evaldata/README.md
