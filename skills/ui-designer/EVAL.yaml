prompt: |
  Use the ui-designer skill for realistic web and mobile app projects that need UI guidelines and design reviews of implemented screens. Include a mobile app review case where layout must be small-screen focused and navigation must work by touch/one-finger browsing.
expectations:
  - "for MVP work reads the mvp plan scope contract and designs only one primary and no more than two supporting CUJs"
  - "for MVP work maps every screen and state to a selected CUJ step counts and minimizes entry to value actions and excludes parked features"
  - "for MVP work gives each screen one primary job and avoids unnecessary onboarding dashboards navigation settings fields and choices"
  - "for MVP work preserves essential accessibility trust privacy loading empty error success and recovery states while simplifying"
  - "creates or updates a durable UI guideline artifact"
  - "UI guideline covers layout, visual language, components or states, accessibility basics, and copy tone"
  - "distinguishes mobile app UX review from web app UX review when the product is mobile or mobile-first"
  - "mobile review checks simple focused screens, touch target size, thumb reach zones, one-finger navigation, and native mobile navigation patterns"
  - "reviews real or specified implemented UI against the UI guideline"
  - "captures or requests screenshot/evidence for UI findings"
  - "separates guideline violations from subjective preferences"
  - "searches the issue system before filing UI bugs"
  - "files actionable UI bugs with severity, expected vs actual, evidence, and guideline reference"
  - "creates follow-up work when the UI guideline is missing or ambiguous"
  - "spawns an independent english-copywriter subagent to review all visible UI text during design iterations and UI reviews"
  - "requires the copywriter to run a minimum-text pass before rewrites and remove or replace unnecessary explanatory text when the UI can explain itself"
  - "iterates designs and copy until english-copywriter returns PASS or PASS WITH MINOR POLISH or documents a real blocker"
  - "preserves necessary copy for labels accessibility comprehension trust error recovery and destructive-action consequences"
  - "spawns an independent ui-reviewer subagent to review newly generated UI design images"
  - "requires the ui-reviewer to create or update a project UI review guideline with foundational principles and top market comparables when missing"
  - "iterates designs until ui-reviewer returns PASS or PASS WITH MINOR POLISH or documents a real blocker"
  - "annotates important interactive components in generated design images with stable IDs"
  - "includes an annotation legend mapping each interactive component ID to expected behavior states destinations validation and accessibility notes"
  - "presents material UX design ideas as runnable prototypes or concrete mockups with clean screenshots rather than verbal descriptions"
  - "creates a rendered DESIGN_REVIEW.md index with embedded screenshots runnable preview links a comparison matrix a recommendation and stable variant screen and hotspot anchors"
  - "when a draft GitHub PR is only a temporary design review surface marks it REVIEW ONLY DO NOT MERGE in branch title body and available labels assigns cleanup ownership and never merges it"
  - "reads unresolved design review threads updates canonical prototype source regenerates and verifies screenshots replies with the addressing revision and resolves only addressed agreed comments"
  - "keeps disputed design decisions open and separates resolved threads explicit design approval engineering handoff and PR merge"
  - "after review preserves the selected design at its canonical destination closes the review only PR without merge and verifies cleanup of temporary branch worktree previews captures copies access and scratch assets"
setupCommands: []
teardownCommands: []
parameters:
  fixture: evaldata/README.md
