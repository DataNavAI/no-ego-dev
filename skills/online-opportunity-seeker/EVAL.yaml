prompt: |
  Use the online-opportunity-seeker skill to respond to this realistic opportunity research request:

  "I want to build a broad pet-services search destination around dog walkers, pet sitters, and anxious first-time dog owners, but I will not personally do outbound sales, social posting, paid ads, influencer outreach, or ongoing content. Research opportunities using public autocomplete entity/modifier probes, Reddit/community pain even if direct pages are restricted, existing search results, and app/plugin competitors. Compare candidates at similar breadth, explain permission-first organic validation and an SEO-first interactive wedge whose answer, guided action, and optional share artifact solve the same user job, and give a ranked shortlist with evidence, distribution paths, business-conflict checks, and measurable go/no-go validation thresholds."
expectations:
  - "states vertical scope assumptions target users geography language platform scope and source limitations"
  - "creates or names durable research artifacts such as opportunity map keyword map community pain log competitor matrix opportunity shortlist and validation plan"
  - "builds multiple keyword clusters with query examples intent and demand proxies or explicit unknowns rather than relying on one head term"
  - "includes Reddit or community research paths pain patterns urgency and community norms or explains if community evidence is unavailable"
  - "maps existing services from Google search app stores or marketplaces including competitors substitutes manual workarounds strengths gaps and review or complaint signals"
  - "separates evidence from assumptions and avoids invented search volume trend percentages review counts downloads revenue or rankings"
  - "synthesizes opportunity patterns where search demand community pain and weak existing products overlap"
  - "identifies anti opportunities or risky crowded ideas to avoid or defer"
  - "ranks at least three product opportunities with pain intensity evidence quality acquisition potential competitive gap MVP feasibility monetization risk and wedge strength"
  - "for top opportunities provides target user job to be done existing alternatives gap MVP concept critical user journey acquisition keywords or communities monetization hypothesis risk and validation test"
  - "includes mobile/app store reality for app-like opportunities such as app store competitor review signals screenshots subscriptions update recency and policy or trust constraints"
  - "routes next work to product-manager for PRD ui-designer for mocks marketer for validation or project-manager for issue routing as appropriate"
  - "does not produce generic ideas disconnected from keyword search language community pain existing services or app store evidence"
  - "separates broad seed recurrence from forced entity modifier probes preserves source locale date and raw evidence and audits ambiguous franchise or fictional contamination"
  - "when direct Reddit access is restricted uses only public fallbacks cites original thread URLs labels archive limitations avoids stale engagement claims and marks live rule verification pending"
  - "compares broad destination candidates at similar audience breadth and classifies shared infrastructure and narrow reserve verticals separately"
  - "requires moderator permission builder disclosure direct working value routes privacy safe attribution and separate panel incentivized creator and organic cohorts"
  - "makes an SEO first result answer the query before signup or sharing and verifies that interaction and sharing reinforce the same user job"
  - "for every shortlist item names a discovery channel without operator led marketing why users can find it and an active business conflict check"
  - "applies the SEO first destination branch to a general interest or community context rather than treating fandom as a required domain"
  - "preserves the query answer to guided learning or action to proof or useful share artifact journey and never gates the promised answer behind signup sharing or an unrelated game"
  - "validates SEO demand and product satisfaction separately using dated locale aware query evidence task completion time to confidence actual share behavior referred user completion and predeclared numeric go or no go thresholds"
  - "applies the no marketing channel first filter without assuming organic traffic and includes store search marketplace or SEO evidence competitor recency and a validation test compatible with the operator constraints"
setupCommands: []
teardownCommands: []
