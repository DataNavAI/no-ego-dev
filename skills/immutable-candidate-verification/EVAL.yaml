prompt: |
  A sequential implementation task has a clean candidate commit, focused RED-GREEN evidence, and passing tests. One composite independent reviewer must approve the exact candidate and current base before the next task starts; a predeclared specialist is required only for a named non-overlapping high-risk scope. One reviewer returns late against an older SHA, another times out after writing a report, and a post-review evidence correction changes the commit.

  Use the immutable-candidate-verification skill to execute the gate and decide whether work may advance.
expectations:
  - "Requires one composite independent approval, every predeclared specialist bundle, and any separate domain authority to name the same clean immutable candidate and current base before task completion."
  - "Does not treat tests, staged-diff review, lifecycle completion, or an older-SHA approval as authorization to advance."
  - "Preserves focused RED-GREEN evidence and runs focused, integration, canonical, syntax, and diff checks appropriate to the task."
  - "Stages exact authorized paths, completes readiness, commits, and then runs one composite immutable post-commit review plus only predeclared non-overlapping specialists."
  - "Invalidates earlier verdicts after any code, test, fixture, documentation, or evidence correction changes the SHA."
  - "Recovers and verifies a timed-out review report, sidecar, explicit verdict, and candidate identity before using it."
  - "Triages reproducible findings from a stale older-SHA review against the current candidate without transferring its verdict."
  - "Keeps the next sequential task blocked until every required gate passes at the final exact SHA."
  - "Preserves repository cleanliness and candidate identity after verification."
  - "Prioritizes hard-to-reverse high-consequence findings and excludes safely reversible nits from blocking review."
  - "Requires comprehensive Round 1 findings with enough correction direction and limits later feedback to prior findings remediation regressions unavailable evidence or otherwise undiscoverable material issues."
  - "Keeps exact-SHA gates but permits no more than three total review rounds for one stable scope and blocks rather than creating a Round 4 candidate."
  - "For rounds two and three passes all prior exact review reports in cumulative generation order a stable finding disposition ledger a remediation change map and a bound prior-context digest to the fresh reviewer."
  - "Requires reconciliation and a contradiction check so later reviewers do not contradict prior feedback without an explicit evidence-backed correction."
  - "Rejects unrelated new findings while preserving allowed material safety findings with an explicit late-discovery cause."
  - "Preserves a genuine late material defect that was reasonably discoverable earlier as a material process escape keeps the gate blocked and escalates instead of suppressing or drip-feeding it."
setupCommands: []
teardownCommands: []
parameters:
  fixture: evaldata/README.md
