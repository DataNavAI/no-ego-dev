prompt: |
  Use the product-manager skill to respond to a realistic client/project request for a user-facing product that needs a PRD and a way to learn from user feedback after launch.
expectations:
  - "mentions durable artifact"
  - "explicitly classifies the work as prototype MVP beta or production iteration with rationale"
  - "for an MVP plans a fully working serviceable core product rather than a stakeholder demo"
  - "includes real deployment or release target for the MVP or a justified exception"
  - "includes serviceability operability support monitoring rollback ownership and QA gates for major user flows"
  - "includes verification"
  - "avoids vague next steps"
  - "adds a way for users to submit feedback"
  - "defines daily feedback review cadence, owner, channels, and recording destination"
  - "defines product metrics tied to the value proposition and primary critical user journey"
  - "identifies target market language locale region currency timezone app store region payment methods or local assumptions when relevant"
  - "uses local language and local region settings when referencing foreign services or records a follow up task to verify the local experience"
  - "calls out degraded foreign service experience risks and region appropriate alternatives when they affect the core user journey"
  - "identifies supported and planned platforms such as web android ios or other relevant surfaces when multiple platforms are in scope"
  - "includes a cross platform feature parity matrix with feature state and core critical user journey behavior per platform"
  - "proactively creates or updates follow up tasks for platform parity gaps instead of only documenting them"
  - "defines daily cross platform parity review cadence owner evidence sources and artifact destination when multiple platforms are in scope"
  - "documents intentional platform differences with rationale and platform specific acceptance criteria"
  - "includes activation funnel engagement retention and conversion or revenue metrics or explicitly marks categories not applicable"
  - "specifies analytics events or dashboard/report destination review cadence and what to do if metrics regress"
  - "researches and recommends a cost effective analytics tool by default or explicitly reuses an adequate existing analytics stack"
  - "creates follow-up work when product metrics instrumentation is missing"
  - "treats bug reports as defects to verify or route to QA/issue triage"
  - "does not take non-bug feedback literally and instead identifies user context, underlying problem, and simplest solution"
  - "does not react to random one-off feedback unless it aligns with core product value or reveals a bug or risk"
  - "acts on repeated feedback patterns when more than a few users report the same underlying problem"
  - "for every production service plan includes a release-blocking metric collection regression task that proves emission transport retry collection ingestion storage aggregation destination reporting readback and missing or malformed signal detection"
setupCommands: []
teardownCommands: []
parameters:
  fixture: evaldata/README.md
