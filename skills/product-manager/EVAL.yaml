prompt: |
  Use the product-manager skill to respond to a realistic client/project request for a new user-facing product idea that needs visual concept clarification, a PRD, and a way to learn from user feedback after launch.
expectations:
  - "mentions durable artifact"
  - "explicitly classifies the work as prototype MVP beta or production iteration with rationale"
  - "for a new product idea or visually meaningful feature request creates or requests 2 to 3 concrete design mock options before finalizing the PRD"
  - "presents visual mock options in user facing language and asks the user to choose combine or reject a direction"
  - "records the selected mock direction and rationale in the PRD and links mock artifacts under a design artifact path"
  - "for an MVP loads mvp-planning and creates .projects project product mvp-plan.md or the project equivalent"
  - "for an MVP selects one key user problem exactly one primary CUJ and no more than two necessary supporting CUJs"
  - "for an MVP cuts every capability screen platform integration or service that does not enable a selected CUJ and records must ship manual internal and parking lot scope"
  - "for an MVP requires the shortest intuitive UX path with minimized user visible actions one primary job per screen and no parked features represented"
  - "for an MVP requires a CUJ traceability matrix with automated coverage zero context manual smoke QA supported interface evidence and release blockers"
  - "for an MVP plans a fully working serviceable core product rather than a stakeholder demo"
  - "includes real deployment or release target for the MVP or a justified exception"
  - "includes serviceability operability support monitoring rollback ownership and QA gates for major user flows"
  - "includes verification"
  - "avoids vague next steps"
  - "adds a way for users to submit feedback"
  - "defines daily feedback review cadence, owner, channels, and recording destination"
  - "defines product metrics tied to the value proposition and primary critical user journey"
  - "identifies target market language locale region currency timezone app store region payment methods or local assumptions when relevant"
  - "uses local language and local region settings when referencing foreign services or records a follow up task to verify the local experience"
  - "calls out degraded foreign service experience risks and region appropriate alternatives when they affect the core user journey"
  - "identifies supported and planned platforms such as web android ios or other relevant surfaces when multiple platforms are in scope"
  - "includes a cross platform feature parity matrix with feature state and core critical user journey behavior per platform"
  - "proactively creates or updates follow up tasks for platform parity gaps instead of only documenting them"
  - "defines daily cross platform parity review cadence owner evidence sources and artifact destination when multiple platforms are in scope"
  - "documents intentional platform differences with rationale and platform specific acceptance criteria"
  - "creates and maintains the canonical supported device interface registry at .projects project product supported-device-interfaces.yaml"
  - "records support status user or CUJ scope implementation minimum environment owner and intentional differences for each candidate interface"
  - "requires at least one executable test case and fresh release-candidate QA evidence for every supported device interface"
  - "treats undecided interfaces and supported interfaces without test coverage as deployment blockers"
  - "includes activation funnel engagement retention and conversion or revenue metrics or explicitly marks categories not applicable"
  - "specifies analytics events or dashboard/report destination review cadence and what to do if metrics regress"
  - "researches and recommends a cost effective analytics tool by default or explicitly reuses an adequate existing analytics stack"
  - "creates follow-up work when product metrics instrumentation is missing"
  - "treats bug reports as defects to verify or route to QA/issue triage"
  - "does not take non-bug feedback literally and instead identifies user context, underlying problem, and simplest solution"
  - "does not react to random one-off feedback unless it aligns with core product value or reveals a bug or risk"
  - "acts on repeated feedback patterns when more than a few users report the same underlying problem"
  - "spawns a fresh independent subagent to review the complete latest PRD revision rather than self reviewing"
  - "requires structured PRD review findings with verdict severity evidence recommendation unresolved decisions and scope challenges"
  - "checkpoints an exact PRD revision round and REVIEW_PENDING state after asynchronous delegation and blocks handoff without fabricating approval"
  - "defines callback continuation that saves findings records dispositions revises blocker high and accepted medium findings and sends the latest PRD to a fresh reviewer"
  - "continues the revision state machine until the latest PRD is approved or approved with minor notes with no unresolved blocker or high findings"
  - "bounds the PRD revision gate to three review rounds detects stalled feedback and escalates unresolved decisions instead of self approving"
  - "saves review artifacts and identifies the exact PRD revision reviewed"
  - "uses Google Trends for new product demand research with target geo language time category and search surface settings and inspects Top and Rising related queries and topics"
  - "clusters related searches by user intent maps them to the key problem CUJs and value proposition hypotheses and cross checks the relative signal without treating it as absolute demand"
  - "saves Google Trends evidence URLs exports or screenshots caveats and hypotheses under .projects project research demand-validation.md and never fabricates unavailable values"
  - "suggests an honest paid landing page smoke test with 2 to 4 query informed value proposition variants message matched ads pages one qualified CTA and coming soon or early access disclosure"
  - "predeclares budget sample conversion thresholds UTMs qualified conversion metrics stop loss and continue iterate stop decision rules rather than judging clicks alone"
  - "requires explicit user approval before ad spend or publication and prohibits fabricated testimonials false scarcity unsupported claims charging for unavailable features or misleading availability"
  - "presents core or material PRD Markdown through reviewable-artifacts with a rendered draft GitHub PR stable decision risk and question anchors and explicit decisions requested"
  - "requires visual product directions to use ui-designer runnable prototypes screenshots and DESIGN_REVIEW.md instead of verbal explanations and blocks rather than selecting from prose when visual tooling is unavailable"
  - "reads addresses replies to and resolves inline human review threads only after updating and verifying the canonical PRD or design revision"
  - "blocks architecture handoff on unresolved material product decisions and separates thread resolution artifact approval and merge"
setupCommands: []
teardownCommands: []
parameters:
  fixture: evaldata/README.md
