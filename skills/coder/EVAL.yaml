prompt: |
  Use the coder skill to respond to a realistic client/project request.
expectations:
  - "Uses self-review and appropriate automated checks by default, without dispatching a reviewer or waiting for independent approval."
  - "Uses a separate review only when the user explicitly requests it; never adds review-round or approval-receipt ceremony to ordinary work."
  - "Preserves user authorization, actual test/provider checks, secret protection and truthful completion evidence."
  - "For a merged NED feature, uses the maintained local-container updater to restart on latest verified remote main, preserves data and credentials, and reads back running revision, health and Hub connectivity before completion; never substitutes a native COM restart or old-image restart."
  - "Treats busy/deferred, missing ownership, pending CI and failed health as pending container delivery even on exit zero; does not kill work or bypass maintenance/rollback and does not apply NED-local container instructions to unrelated projects. See evaldata/local-container-after-merge.md."
  - "Tracks every actionable user development request in NED before implementation, reuses matching goals/tasks for follow-ups, and maintains verified state without inventing edit commands; explicit user tracker choices take precedence."
  - "mentions durable artifact"
  - "includes verification"
  - "avoids vague next steps"
  - "does not add explanatory user facing text that is absent from the PRD design artifacts tech spec linked issue or explicitly referenced existing pattern"
  - "flags missing UI copy or microcopy specifications instead of inventing text"
  - "detects whether project-owned static analysis already exists"
  - "installs and configures an ecosystem-appropriate static analyzer when absent"
  - "runs static analysis after every code change"
  - "fails closed on static analysis findings or unavailable required setup"
  - "does not weaken rules or add blanket suppressions"
  - "predeclares a separate specialist only for a named non-overlapping high-risk expertise gap"
  - "Requires reconciliation and a contradiction check so later reviewers do not contradict prior feedback without an explicit evidence-backed correction."
  - "Rejects unrelated new findings while preserving allowed material safety findings with an explicit late-discovery cause."
  - "Preserves a genuine late material defect that was reasonably discoverable earlier as a material process escape keeps the gate blocked and escalates instead of suppressing or drip-feeding it."
  - "chooses the lowest reliable test layer by preferring deterministic unit tests then focused integration tests and keeping E2E coverage to the smallest irreducible critical journeys"
  - "does not make a broad browser device or cross-environment E2E matrix an unconditional PR merge gate"
  - "requires every E2E test to own a unique full-stack risk that lower layers cannot prove and removes redundant permutations to unit or integration coverage"
  - "runs an irreducible critical E2E smoke test on a PR whenever that change can affect the unique full-stack journey the test owns"
  - "does not mask flaky or slow E2E tests with blind retries sleeps or weaker assertions and permits temporary quarantine only with replacement coverage where possible an owner issue expiry and explicit residual risk"
  - "never silently waives a critical safety data-loss payment authentication migration or publication boundary merely to accelerate PR merge"
  - "positive: recover and validate an exact-base implementation using current-base merge, fail-closed validation, durable transactions, source/evidence closure, and consumer parity"
  - "boundary/negative: must not execute untrusted model output in-process, hang on a missing TTY, or apply provider/domain recipes outside their declared scope"
setupCommands: []
teardownCommands: []
parameters:
  fixture: evaldata/README.md
