prompt: |
  Apply the ned-chat-desktop-review skill to the scenarios in the supplied fixture. Explain the
  browser setup, ordered actions, evidence, and expected report for each. The
  inputs are synthetic descriptions and cannot be played or used as live URLs.
  Do not claim that a recording or live acceptance occurred.
expectations:
  - Uses the specified desktop emulation and private recording context
  - Exercises the real chat workflow in the proposed live procedure and counts every send
  - Stops at ten sends and finalizes even partial recording
  - Uses timestamps and visible UI evidence for recommendations
  - Identifies incomplete capture and limits of edited or device-mismatched Muse footage
  - Scores seven weighted dimensions independently and treats missing evidence or critical failures as a failed threshold
  - Cites matched events and reports persistent secondary actions, composer movement, and hidden final replies even when functional checks pass
  - Requires timestamped evidence of live tail following, hold while reading earlier text, and Jump to latest before completion
setupCommands: []
teardownCommands: []
parameters:
  fixture: evaldata/README.md
