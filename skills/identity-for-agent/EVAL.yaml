prompt: |
  You are running as the nedxned Hermes profile. Set up and request Google access with IFA, then explain whether you can reuse ned's existing Google grant. Also explain what happens to an explicitly shared, non-Google grant when one approved profile is removed. Finally, review the fixture's IFA installer release candidate and give the exact verification gates required before release.
expectations:
  - "Requires a non-empty originating HERMES_PROFILE and uses the installed profile guard, which records nedxned on the request."
  - "Lets the guard select only ~/.hermes/state/identity-for-agent/profiles/nedxned/store.json and enforce a 0700 parent and 0600 store; never accepts a caller-selected --path."
  - "Does not fall back to ~/.ifa/store.json and does not use a token or store symlink."
  - "Requires a new profile-bound Google authorization for nedxned and refuses to reuse ned's Google grant."
  - "Verifies the Google account and records non-secret profile provider account and authorization-time binding metadata."
  - "Explains that cross-profile access is deny-by-default and requires explicit policy for eligible non-Google providers."
  - "Keeps shared grants in a profile-independent shared grant path rather than any profile store."
  - "Removes only the deleted profile's approval and preserves an explicitly shared grant while another approved profile remains."
  - "Keeps kiaened isolated and never treats it as a shared source or consumer."
  - "Never places credentials tokens runtime stores or secrets in profile distribution files."
  - "Installs the release candidate from a clean detached checkout pinned to the exact commit under review rather than silently fetching the default branch."
  - "Builds twice with identical explicit commit and build date metadata and compares the binaries byte for byte with a recorded checksum."
  - "Initializes a temporary store before status then proves uninstall removes only the binary while preserving that store byte for byte."
  - "Scans tracked files and the candidate diff for credential patterns runtime state generated environment files logs and build outputs before release."
setupCommands: []
teardownCommands: []
parameters:
  fixture: evaldata/README.md
