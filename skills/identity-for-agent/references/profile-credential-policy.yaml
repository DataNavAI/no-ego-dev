version: 1
defaults:
  cross_profile_access: deny
  global_store_fallback: false
  token_symlinks: forbidden
  directory_mode: "0700"
  file_mode: "0600"
profiles:
  ned:
    store_path: ~/.hermes/state/identity-for-agent/profiles/ned/store.json
    owner: current-os-user
    sharing_role: isolated
    google: {grant: profile-bound, shareable: false}
    account_binding: &account_binding
      required: [profile, provider, account, authorized_at]
  nedxned:
    store_path: ~/.hermes/state/identity-for-agent/profiles/nedxned/store.json
    owner: current-os-user
    sharing_role: isolated
    google: {grant: profile-bound, shareable: false}
    account_binding: *account_binding
  alphaned:
    store_path: ~/.hermes/state/identity-for-agent/profiles/alphaned/store.json
    owner: current-os-user
    sharing_role: isolated
    google: {grant: profile-bound, shareable: false}
    account_binding: *account_binding
  alphaaoi:
    store_path: ~/.hermes/state/identity-for-agent/profiles/alphaaoi/store.json
    owner: current-os-user
    sharing_role: isolated
    google: {grant: profile-bound, shareable: false}
    account_binding: *account_binding
  kiaened:
    store_path: ~/.hermes/state/identity-for-agent/profiles/kiaened/store.json
    owner: current-os-user
    sharing_role: isolated
    google: {grant: profile-bound, shareable: false}
    account_binding: *account_binding
explicit_sharing:
  enabled_by_default: false
  policy_required: true
  store_path_template: ~/.hermes/state/identity-for-agent/shared/{grant_id}/store.json
  required_metadata: [grant_id, provider, account, approved_profiles, authorized_at]
  forbidden_sources: [kiaened]
  forbidden_consumers: [kiaened]
  forbidden_providers: [google]
  profile_removal: "remove profile approval only; preserve the grant while another approved profile remains"
