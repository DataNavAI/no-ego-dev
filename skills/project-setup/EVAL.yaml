prompt: |
  Use project-setup and respond to the operator scenarios in the fixture.
  Execute local setup and registration in a disposable NED workspace and database.
  Supply no real credentials and perform no external provider consent.
expectations:
  - Collects only missing project and essential resource details and clarifies an ambiguous project.
  - Creates one safe persistent project folder and keeps existing documentation on retry.
  - Registers via the real Core-backed NED CLI and verifies the same project on readback without claiming success on failure.
  - Requests scoped access using provider or guarded controls, keeps secrets out of chat and notes, and reports pending consent honestly.
setupCommands: []
teardownCommands: []
parameters:
  fixture: evaldata/scenarios.md
