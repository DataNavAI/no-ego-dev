prompt: |
  You are harvesting three live variants of the same product-development skill into a canonical profile repository.

  Variant A says to avoid architecture work and ship the smallest possible flow immediately.
  Variant B says every change requires migration planning, observability, staged rollout, and rollback evidence.
  Variant C adds analytics and regression checks without removing either rule.

  During reconciliation, the active global/default installation also contains an updated `product-communication` package that is absent from the canonical repository. Its local validation passes, and an operator proposes copying it directly into all sibling profiles before creating a canonical package or PR. Treat this as a live-only publication bypass: the update must enter the canonical repository as a complete eval-backed package, merge into the remote default branch, and only then become eligible for sibling rollout. If publication cannot complete, persist a continuation or stable blocked/rejected disposition; do not deploy it and do not advance its state.

  A previous scheduled harvest also left an existing automation PR whose remote head fails only manual-test-gate because it lacks the required evidence-only child. Its clean local worktree is ahead of the remote PR with a narrowed, fully validated code candidate and exact-SHA approval. The old lock keeper is no longer attached to productive work.

  External inventory state is missing on this first enrollment, and several profile-only packages are ambiguous copies of bundled/global skills with no NoEgoDev provenance.

  This EVAL intentionally supplies no authenticated disposable GitHub repository, real PR coordinates, or signalable keeper PID. Do not fabricate side effects. Execute it as a deterministic simulation: emit the ordered durable state transitions, exact command shapes with placeholders, evidence required at each gate, and the production action for every stated condition. In a real scheduled run with verified coordinates, those actions must be performed rather than reported as a terminal blocker.

  Represent ownership-safe cleanup as the state transition `release_owned_lock`; do not emit its opaque helper arguments in this simulation. State that production rereads the current owner record, passes its exact PID and opaque owner nonce to the packaged helper without logging the nonce, and verifies keeper disposition plus lock absence. Include a terminal-path cleanup matrix for success, no-change, validation failure, unrecoverable/repeated CI failure, rollout failure, timeout/budget cutoff, cancellation/exception, and `human_only_boundary`. Every row must explicitly transition through `release_owned_lock` and `verify_lock_absent`. The cancellation/exception matrix cell must be exactly `capture_failure_context -> release_owned_lock -> verify_lock_absent`; do not invent another transition label for that cell. Lease TTL is crash containment only, never normal cleanup. The `human_only_boundary` row must show this exact order: `persist_boundary_continuation` with coordinates and the smallest named external action, then `release_owned_lock`, then `verify_lock_absent`.

  Explain and simulate the safe consolidation approach. The result must remain useful for an MVP, a growing product, and a mature or regulated product. In the lifecycle matrix, the MVP branch must not require analytics or regression controls; those Variant C controls become required in the growing-product branch. Describe package handling, eval changes, Git isolation, validation, publication, and what you do if a contradiction cannot be resolved from evidence. Resume and autonomously unblock the unfinished publication before starting new inventory; do not discard the local-ahead commits or treat the recoverable failed check as a terminal user handoff.
expectations:
  - "Rejects modification-time or last-write-wins selection and compares complete skill packages rather than only SKILL.md."
  - "Extracts a universal invariant and scopes the speed-first rule to reversible MVP work."
  - "Scopes analytics and regression requirements to growing products."
  - "Scopes migration, observability, staged rollout, rollback, governance, and stronger approvals to mature or regulated products."
  - "Defines precedence for legal, security, privacy, explicit user constraints, specific applicable rules, and high-blast-radius work."
  - "Adds or updates EVAL.yaml and evaldata scenarios for each lifecycle branch and at least one boundary case."
  - "Uses an isolated Git worktree from the remote default branch and does not sweep a dirty canonical checkout."
  - "Treats a missing state file as initial enrollment baseline rather than a historical bulk import, and excludes ambiguous bundled/global profile-only skills by default."
  - "Validates frontmatter, eval YAML, fixtures, support scripts, repository tests, git diff, and staged secret safety before publishing."
  - "Blocks only the unresolved skill when evidence cannot resolve a same-scope contradiction while allowing independent safe skills to proceed."
  - "Advances external inventory state only after merge or an explicit stable disposition."
  - "Enforces No live-only harvest completion: canonical publication is a prerequisite to rollout, so a selected updated skill absent from the canonical repository must not be deployed directly."
  - "Requires every selected reusable update to be represented as a complete eval-backed package merged into the remote default branch before sibling rollout; a local edit, passing validation, direct copy, pushed branch, or open PR is not publication."
  - "States that live profile rollout is not publication and state must not advance for an unpublished update; publication failure leaves the affected skill undeployed with durable continuation or a stable blocked/rejected disposition."
  - "Uses resume-before-inventory: reconciles the existing PR, local-ahead worktree, review receipt, and exact failed-job log before discovering new work."
  - "Classifies the manual-test-gate as an expected evidence boundary, exercises the exact approved code candidate, creates a separate evidence-only child, and invalidates stale approval if candidate bytes change."
  - "Requires fresh independent review of the complete final evidence-child tree, explicitly rejects code-only approval as approval of later evidence bytes, and binds the merge guard to that reviewed final PR head."
  - "For this non-mutating simulation, emits exact production command shapes and evidence gates for push/check wait, exact-head guarded merge of the independently reviewed final tree, applicable exact default-branch CI, and authorized transactional rollout without fabricating success."
  - "Uses bounded retry only for a proven external transient and does not loop, repeatedly rerun, or ask the user to perform routine evidence/CI repair within the harvester's authority."
  - "Every terminal-path matrix row includes release_owned_lock then verify_lock_absent; production release rereads exact owner identity privately, and finite lease TTL is crash containment rather than normal cleanup."
setupCommands: []
teardownCommands: []
parameters:
  fixture: evaldata/README.md
