prompt: |
  You are harvesting three live variants of the same product-development skill into a canonical profile repository.

  Variant A says to avoid architecture work and ship the smallest possible flow immediately.
  Variant B says every change requires migration planning, observability, staged rollout, and rollback evidence.
  Variant C adds analytics and regression checks without removing either rule.

  A previous scheduled harvest also left an existing automation PR whose remote head fails only manual-test-gate because it lacks the required evidence-only child. Its clean local worktree is ahead of the remote PR with a narrowed, fully validated code candidate and exact-SHA approval. The old lock keeper is no longer attached to productive work.

  External inventory state is missing on this first enrollment, and several profile-only packages are ambiguous copies of bundled/global skills with no NoEgoDev provenance.

  This EVAL intentionally supplies no authenticated disposable GitHub repository, real PR coordinates, or signalable keeper PID. Do not fabricate side effects. Execute it as a deterministic simulation: emit the ordered durable state transitions, exact command shapes with placeholders, evidence required at each gate, and the production action for every stated condition. In a real scheduled run with verified coordinates, those actions must be performed rather than reported as a terminal blocker.

  Represent ownership-safe cleanup as the state transition `release_owned_lock`; do not emit its opaque helper arguments in this simulation. For the pre-existing live-but-orphaned keeper, the trace must first verify the immutable packaged helper, classify that exact keeper as orphaned from PID/token, command/ancestry, session, worktree, PR, and continuation evidence, perform authenticated `release_owned_lock`, and `verify_lock_absent`; only then may it acquire a new finite lease, before any publication reconciliation reads. State that production rereads the current owner record, passes its exact PID and opaque owner nonce to the packaged helper without logging the nonce, and verifies keeper disposition plus lock absence. Include a terminal-path cleanup matrix for success, no-change, validation failure, unrecoverable/repeated CI failure, rollout failure, timeout/budget cutoff, cancellation/exception, and `human_only_boundary`. Every row must explicitly transition through `release_owned_lock` and `verify_lock_absent`. The cancellation/exception matrix cell must be exactly `capture_failure_context -> release_owned_lock -> verify_lock_absent`; do not invent another transition label for that cell. Lease TTL is crash containment only, never normal cleanup. The `human_only_boundary` row must show this exact order: `persist_boundary_continuation` with coordinates and the smallest named external action, then `release_owned_lock`, then `verify_lock_absent`.

  Explain and simulate the safe consolidation approach. The result must remain useful for an MVP, a growing product, and a mature or regulated product. In the lifecycle matrix, the MVP branch must not require analytics or regression controls; those Variant C controls become required in the growing-product branch. Describe package handling, eval changes, Git isolation, validation, publication, and what you do if a contradiction cannot be resolved from evidence. Resume and autonomously unblock the unfinished publication before starting new inventory; do not discard the local-ahead commits or treat the recoverable failed check as a terminal user handoff. During rollout preflight, any reusable target delta absent from canonical must stop that rollout generation and be re-harvested into a newly validated, exact-SHA-reviewed, merged canonical generation before overwrite; merely blocking the target is insufficient for reusable drift.

  Include a section named `pre_freeze_semantic_disposition_ledger`. Give a separate origin/evidence plus exactly one allowed disposition for every behavior delta: Variant A speed/architecture avoidance, Variant B migration planning, observability, staged rollout, rollback evidence, mature/regulated governance, audit evidence, approval boundaries/stronger approvals, and Variant C analytics and regression controls. Separately enumerate each support-file category that differs (`EVAL*.yaml`, `evaldata/`, `references/`, `scripts/`, `templates/`, and `assets/`) under the same ledger contract before candidate freeze. Include a section named `version_independent_variant_scan` that explicitly inspects distinct lower-version, equal-version, higher-version, missing-version, malformed-version, and previously baselined digests and explains that none is filtered from semantic synthesis. For new inventory, emit the production transition and command shape that fetches remote default and creates a unique isolated candidate branch/worktree from `origin/<default>` while leaving the dirty canonical checkout untouched. At the freeze gate, explicitly enumerate frontmatter validation, loading all changed `EVAL*.yaml` through the production loader, fixture existence and delivery to agent plus judge, support-script checks, repository tests, focused staged-diff inspection, `git diff --check`, and staged-byte secret scanning. In the condition-to-production-action matrix, name the external-only condition `human_only_boundary` and state its smallest external action. Use redaction-safe state labels rather than credential-shaped key/value prose so the named condition and action survive report scrubbing.
expectations:
  - "Rejects modification-time or last-write-wins selection and compares complete skill packages rather than only SKILL.md."
  - "Inspects and semantically synthesizes every distinct lower equal higher missing-version or baselined package digest because version is metadata not authority."
  - "Produces a semantic disposition ledger covering every behavior and support-file delta as adopted scoped superseded product-local unsafe or unresolved before freezing or rollout."
  - "Re-harvests reusable target drift before overwrite and leaves unsafe or unresolved package state unadvanced."
  - "Extracts a universal invariant and scopes the speed-first rule to reversible MVP work."
  - "Scopes analytics and regression requirements to growing products."
  - "Scopes migration, observability, staged rollout, rollback, governance, and stronger approvals to mature or regulated products."
  - "Defines precedence for legal, security, privacy, explicit user constraints, specific applicable rules, and high-blast-radius work."
  - "Adds or updates EVAL.yaml and evaldata scenarios for each lifecycle branch and at least one boundary case."
  - "Uses an isolated Git worktree from the remote default branch and does not sweep a dirty canonical checkout."
  - "Treats a missing state file as initial enrollment baseline rather than a historical bulk import, and excludes ambiguous bundled/global profile-only skills by default."
  - "Validates frontmatter, eval YAML, fixtures, support scripts, repository tests, git diff, and staged secret safety before publishing."
  - "Blocks only the unresolved skill when evidence cannot resolve a same-scope contradiction while allowing independent safe skills to proceed."
  - "Advances an observed digest only after verified remote-default merged publication and applicable rollout/read-back evidence; records rejected or blocked candidate digests separately without baselining them or clearing newly_observed."
  - "Uses resume-before-inventory: reconciles the existing PR, local-ahead worktree, review receipt, and exact failed-job log before discovering new work."
  - "Classifies the manual-test-gate as an expected evidence boundary, exercises the exact approved code candidate, creates a separate evidence-only child, and invalidates stale approval if candidate bytes change."
  - "Requires fresh independent review of the complete final evidence-child tree, explicitly rejects code-only approval as approval of later evidence bytes, and binds the merge guard to that reviewed final PR head."
  - "For this non-mutating simulation, emits exact production command shapes and evidence gates for push/check wait, exact-head guarded merge of the independently reviewed final tree, applicable exact default-branch CI, and authorized transactional rollout without fabricating success."
  - "Uses bounded retry only for a proven external transient and does not loop, repeatedly rerun, or ask the user to perform routine evidence/CI repair within the harvester's authority."
  - "Every terminal-path matrix row includes release_owned_lock then verify_lock_absent; production release rereads exact owner identity privately, and finite lease TTL is crash containment rather than normal cleanup."
  - "For a pre-existing live-but-orphaned keeper, verifies the immutable packaged helper, proves exact orphan ownership, performs authenticated release_owned_lock, verifies lock absence, and only then acquires the new finite lease before publication reconciliation reads; never signals by stale PID or substitutes an inline keeper."
  - "Discovers open and recently closed automation PRs, branches, worktrees, and continuation chains broadly; classifies unrelated work without taking ownership and refreshes mergeability plus dirty-generation evidence after default-branch movement."
  - "Rejects null scalar mapping blank-entry and dual-alias setup or teardown command fields consistently in inventory validation and the production eval loader."
  - "Treats a stale controller runtime as a restart boundary rather than publication: bounded reconciliation may persist exact remaining gates, but review merge rollout state advancement and new inventory wait for fresh runtime proof."
  - "Derives the complete rollout package set from immutable base-to-merge coordinates, exports rollout bytes only from verified remote default, and never treats candidate or open-PR bytes as canonical."
setupCommands: []
teardownCommands: []
parameters:
  fixture: evaldata/README.md
