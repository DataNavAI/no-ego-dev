prompt: |
  Independently review a fixed pull-request commit against an authoritative implementation task, technical specification, failure matrix, and acceptance checklist. The shared checkout is dirty, the PR may move while review runs, focused tests may generate tracked output, and the final response must contain a fail-closed candidate-bound verdict.

  Use the spec-compliance-review skill to define and execute the immutable review procedure without modifying the candidate.
expectations:
  - "Uses self-review and appropriate automated checks by default, without dispatching a reviewer or waiting for independent approval."
  - "Uses a separate review only when the user explicitly requests it; never adds review-round or approval-receipt ceremony to ordinary work."
  - "Preserves user authorization, actual test/provider checks, secret protection and truthful completion evidence."
  - "Identifies the exact review mode and binds the verdict to an immutable commit SHA, parent/base, and authoritative requirements."
  - "Uses an isolated clean worktree or exact-SHA disposable archive instead of resetting or cleaning a dirty shared checkout."
  - "Builds an explicit requirement and failure matrix rather than treating tests or implementation vocabulary as the contract."
  - "Inspects production code, tests, generated artifacts, and every accepted entry path for false-success cases."
  - "Runs mutation or adversarial probes outside the immutable checkout and proves a valid baseline before interpreting failures."
  - "Preserves candidate identity, staged/unstaged state, untracked files, and generated outputs throughout review."
  - "Treats a moving PR head as a candidate identity change and does not transfer approval to an unreviewed SHA."
  - "Does not infer PASS from green tests, partial evidence, a timed-out reviewer, or a stale checksum sidecar."
  - "Returns a concrete PASS or FAIL bound to the reviewed candidate with reproducible evidence."
  - "Prioritizes hard-to-reverse and high-consequence risks while ignoring reversible nits that can safely be fixed later."
  - "the report omits reversible nits entirely rather than attaching minor notes or deferred polish."
  - "Reconciles every prior finding and performs a contradiction check so it does not contradict prior feedback without an explicit evidence-backed PRIOR_FEEDBACK_CORRECTION."
  - "Preserves a genuine late material defect that was reasonably discoverable earlier as a material process escape keeps the gate blocked and escalates instead of suppressing or drip-feeding it."
  - "Positive scenario: binds a dirty or misbound exact-SHA review to the correct repository or authenticated archive and closes catalog allowlist required-argument empty-state own-property and publication-consumer contracts."
  - "Boundary/negative scenario: rejects static-only parity tests lock/source race false success stale async completion and a local auth bypass that does not exercise the registered production contract."
  - "Performs post-report recovery and scopes provider or domain recipes to the boundary actually present."
  - "Positive API-to-consumer contract audit follows the linked reference and verifies continuation caller-state retention canonical IDs cache membership and post-write readback."
  - "Boundary/negative adversarial probes catch stale cache display-as-ID consumer state loss catalog-membership drift double submit and ambiguous write/readback false success."
setupCommands: []
teardownCommands: []
parameters:
  fixture: evaldata/README.md
