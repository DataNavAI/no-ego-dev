prompt: |
  Simulate the supplied authorization requests using the ned-provider-identity skill.
  Provide ordered commands and operator actions. Use synthetic facts only. Do not
  run any live command, contact providers, or claim that consent took place.
expectations:
  - Uses the Hermes ned request_provider_auth action to queue a private authorization form and distinguishes requested from verified.
  - Routes GitHub through NED’s isolated gh auth login wrapper with no new App/client ID, verifies gh api user and requires intended-account confirmation; retains AWS Identity Center and GoDaddy private PAT routing.
  - Requires confirmed identity and appropriate capability before subsequent work.
  - Uses the Review connection card before collecting provider details and never substitutes a raw AWS CLI sign-in URL for the form.
  - Keeps codes and credentials out of chat and accepts no ambient fallback.
  - In an owner-authorized Hub standalone container, queues GitHub or AWS without a public URL argument, keeps their actions separate, and reports missing CLI/unsupported runtime with the correct provider rather than an AWS fallback.
  - Preserves guarded IFA profile requirements and refuses to use the native auth flow through hosted or public COM.
setupCommands: []
teardownCommands: []
parameters:
  fixture: evaldata/requests.md
