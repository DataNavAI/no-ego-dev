prompt: |
  A parent Hermes session dispatched two implementation subagents. One reports completed but only an early commit is on the remote branch; the other timed out after being asked to write a checksum-closed review report. The active-agent view is now empty, the project still has runnable dependency-safe work, and the user does not want a duplicate persistent queue.

  Use the delegation-reliability skill to explain and execute the safe recovery and continuation approach. Distinguish runtime state, durable artifacts, review verdicts, and downstream authorization.
expectations:
  - "Does not treat a delegation handle, completed status, empty active-agent view, or self-report as proof that the requested deliverable exists."
  - "Inspects the remote branch/commit/PR, shared checkout, isolated worker residue, and exact requested report/checksum paths before re-dispatching."
  - "Classifies completed-with-partial-deliverable and timed-out-with-recovered-artifact states separately from task verdicts."
  - "Verifies immutable identities, report bytes, checksums, and explicit verdicts before releasing dependencies."
  - "Validates a candidate-and-base-bound review-readiness receipt, defaults ordinary work to one composite review bundle, nests predeclared specialists under one candidate generation, and uses an atomic review index to suppress duplicate same-bundle dispatch."
  - "When a delivery is truncated or omits its middle, reads the complete saved summary before counting findings, planning remediation, or advancing a gate."
  - "Verifies repository bytes and collaboration metadata separately after interruption and completes only missing idempotent metadata instead of launching another writer for already-complete code."
  - "Uses unique attempt-scoped artifact paths and reconciles late results without overwriting evidence."
  - "Uses hook-only continuation with the canonical external tracker because the user rejected a duplicate queue, while stating that this mode is process-local."
  - "Uses each worker completion as a scheduling-reconciliation wake, keeps hook payloads out of dispatch authority, debounces duplicate wakes, and lets only the authoritative parent/controller schedule the next eligible worker."
  - "Relies on Hermes's process-local active-child registry and completion events for ordinary attached delegation, offers an optional hook ledger only for cross-surface or restart history, and does not require a duplicate lifecycle ledger."
  - "Keeps at least one real worker active when runnable dependency-safe work remains, without racing overlapping writers or mutating a frozen review target."
  - "Treats each top-level batch child as independently handled and delivered, reconciles the first finisher without waiting for siblings, and reserves separate calls for explicit ownership timing capacity or retry boundaries."
  - "Does not recursively schedule agents from a cron watchdog and keeps healthy watchdog output silent."
  - "For rounds two and three passes prior exact review reports a stable finding disposition ledger a remediation change map and a bound prior-context digest to the fresh reviewer."
  - "Requires reconciliation and a contradiction check so later reviewers do not contradict prior feedback without an explicit evidence-backed correction."
  - "Rejects unrelated new findings while preserving allowed material safety findings with an explicit late-discovery cause."
setupCommands: []
teardownCommands: []
parameters:
  fixture: evaldata/README.md
