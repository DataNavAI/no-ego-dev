prompt: |
  Use the ui-reviewer skill in a fresh review-only leaf to review frozen design images or a real product UI for a realistic product. A pre-authored canonical project UI guideline is frozen with the candidate; review without creating or editing the guideline or candidate, and explain the fail-closed result if that guideline were missing.
expectations:
  - "requires a pre-authored frozen canonical project UI guideline and blocks when it is missing"
  - "runs in a fresh review-only leaf and never creates edits or updates candidate or guideline artifacts"
  - "researches or requests at least three top-of-market comparable services and captures relevant UI patterns"
  - "uses foundational UI principles such as hierarchy spacing typography color contrast consistency affordance states accessibility and responsive or mobile fit"
  - "reviews design images screenshots or real UI evidence rather than only text when available"
  - "scores the review as PASS NEEDS ITERATION or BLOCKED"
  - "prioritizes material findings by blocker high or medium impact and omits reversible low-impact nits"
  - "ties feedback to principles guideline sections comparable patterns accessibility or user journey impact"
  - "provides a concrete revision checklist and implementation guardrails when approved"
  - "prioritizes hard-to-reverse and high-consequence journey design-system accessibility and trust decisions while ignoring reversible nits that can safely be fixed later"
  - "the report omits reversible nits entirely rather than attaching minor-polish notes or optional follow-up"
  - "presents all independently discoverable findings in round one with evidence user impact and enough corrective direction"
  - "later-round feedback is limited to unresolved findings revision-introduced regressions genuinely new evidence or material issues not reasonably discoverable in round one"
  - "requires every allowed new later-round blocker to explain why it was not discoverable in round one"
  - "for round two and later requires all prior exact review reports in cumulative generation order a stable finding disposition ledger a remediation change map and a bound prior-context digest before substantive review"
  - "requires one neutral immutable pre-review summary in every review round and blocks unless the authority-bearing gate parses the exact closed-schema canonical artifact verifies lineage recomputes its digest and persists verified bytes"
  - "reconciles every prior finding and performs a contradiction check so it does not contradict prior feedback without an explicit evidence-backed PRIOR_FEEDBACK_CORRECTION"
  - "rejects unrelated new findings and permits new material findings only for allowed causes with why they were not discoverable in round one"
  - "Preserves a genuine late material defect that was reasonably discoverable earlier as a material process escape keeps the gate blocked and escalates instead of suppressing or drip-feeding it."
  - "Uses no fixed round limit and puts Round 4 and later in approval-convergence mode: approve once all prior material blockers are resolved and no new material defect remains, but never approve by exhaustion or suppress a genuine material process escape."
setupCommands: []
teardownCommands: []
parameters:
  fixture: evaldata/README.md
