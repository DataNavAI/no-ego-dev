prompt: |
  Use the project-manager skill to respond to a realistic client/project request.
expectations:
  - "mentions durable artifact"
  - "includes verification"
  - "avoids vague next steps"
  - "includes progress update cadence or phase progress updates"
  - "delegates product, marketing, architecture, coding, devops, UI design, or QA work to specialist subagents"
  - "asks the user to set up or confirm a dedicated project agent Gmail or Google account for SSO service notifications and email communications during new project onboarding"
  - "records the agent Google account ownership purpose email access method and security notes or creates a follow-up setup issue when missing"
  - "does not store or commit passwords recovery codes app passwords OAuth tokens cookies or backup codes for the agent account"
  - "creates or updates a durable issue/task for directly asked actionable work before execution"
  - "runs directly asked actionable work through an appropriate focused subagent by default and verifies returned evidence"
  - "delegates React Native mobile app setup and implementation work to react-native-app-dev when applicable"
  - "delegates Google Play Console UI publishing AAB upload internal testing tester lists and rollout status work to play-store-publisher when applicable"
  - "delegates Google Play CLI API automation fastlane supply EAS Submit Gradle Play Publisher and service account setup work to play-store-cli when applicable"
  - "sets up UI design tasks for each PRD before architecture or tech-spec work when the feature needs UI"
  - "writes or updates a durable UI guideline after the core PRD for new UI-bearing projects"
  - "requires UI-bearing tech specs to cite the UI guideline or feature UI brief"
  - "creates a linked follow-up QA task after implementation task completion"
  - "requires QA pass/fail reports with screenshots and bug links"
  - "triages open bugs before completing a milestone and closes invalid obsolete or wont-fix bugs with rationale"
  - "sets up a routine service status check for deployed or user-facing projects"
  - "service status check pulls product side updates and devops updates including CI status system health hosting cost user traffic and user feedback from multiple channels"
  - "sends the user a service status summary at least once per day for active live projects unless explicitly configured otherwise"
  - "proactively asks for status report email recipient and cadence when either is missing for a live project"
  - "schedules periodic status report emails when recipient and cadence are configured"
  - "discovers active products before scheduling or sending status report email and groups them by recipient cadence and timezone"
  - "when multiple active products share recipient cadence and timezone sends one aggregate portfolio status report email instead of separate per project emails unless separation is required"
  - "email status reports use HTML formatting with inline styles suitable for email clients"
  - "email status reports read like condensed executive summaries focused on product performance improving holding or regressing top-line product metrics wins risks customer signal next actions and evidence links"
  - "email status reports are mentally lightweight readable in under two minutes ideally 300 to 600 words under two pages and avoid raw log dumps or dense project-detail overload"
  - "creates follow-up issues for missing instrumentation missing cost visibility or unhealthy product/devops signals"
  - "creates a fresh checkout worktree or branch for docs non-code and code repository artifact changes"
  - "commits completed repository artifact changes and preserves commit branch or PR evidence"
  - "cleans up temporary checkouts worktrees after merge apply or handoff"
  - "keeps repo markdown or a documented knowledge repo as the canonical source for durable implementation and agent-facing project docs unless there is an explicit Google Docs collaboration reason"
  - "when Google Docs is used records a repo stub/link and sync rule so it does not become an invisible second source of truth"
setupCommands: []
teardownCommands: []
parameters:
  fixture: evaldata/README.md
