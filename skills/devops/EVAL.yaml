prompt: |
  Use the devops skill to respond to a realistic client/project request: set up CI/CD and staging/production deployment for a web app whose domain DNS is managed in GoDaddy. The user wants the setup to be doable through chat after they perform any required one-time provider login or API-key creation.
expectations:
  - "mentions durable artifact"
  - "includes verification"
  - "avoids vague next steps"
  - "for a new project researches 3 to 5 viable hosting options for the actual stack and product constraints before committing to a provider"
  - "presents a concise hosting choice brief with recommendation tradeoffs costs operability and asks the user to choose"
  - "records the hosting decision and rationale in the deployment monitoring runbook or decision log"
  - "uses the configured primary Google account for provider signup SSO or account ownership where practical"
  - "when user intervention is required gives condensed chat friendly instructions that do not assume the user can access the agent machine"
  - "asks upfront for end-to-end devops access covering repository CI deployment provider secrets environments logs monitoring rollback domains and supporting services"
  - "provides easiest-path step-by-step instructions for granting access"
  - "verifies granted access with CLI or API checks before proceeding"
  - "prefers CLI or API access for hosting DNS cloud providers such as GoDaddy when available"
  - "guides the user step by step to obtain and store scoped provider API keys so setup can continue via chat"
  - "includes provider-specific GoDaddy API key guidance when GoDaddy DNS or domains are involved"
  - "avoids repeated permission prompts unless a new external system or stronger permission is required"
  - "requires both staging and production environments"
  - "auto-deploys staging after CI passes on the integration branch"
  - "protects production deploy with approval, tag, protected branch, or explicit command"
  - "reads .projects project product supported-device-interfaces.yaml as the canonical supported device interface release gate"
  - "requires at least one test case and a current PASS with evidence for every supported device interface against the exact release candidate"
  - "blocks deployment store submission or rollout when the registry is missing malformed undecided stale or any supported interface is untested failed or blocked"
  - "maintains a per-project deployment and system monitoring document"
  - "documents environment inventory, deployment flow, secrets by name, health checks, hosting cost visibility, logs, dashboards or alerts, rollback, and operational procedures"
  - "includes hosting cost in periodic system checkups with current spend projected run-rate plan limits usage drivers renewal dates and cost anomalies or missing cost visibility follow-up work"
  - "stores API keys and credentials in a secret store rather than committed env files or chat"
  - "adds or references a local loader script that loads secrets from the store into the local environment without printing secret values"
  - "documents secret-store paths or references, rotation notes, and CI or provider secret consumers without exposing raw secret values"
  - "when asked to monitor services creates a Hermes cronjob with a short plain-language user-facing name and schedule every 5 minutes unless otherwise specified"
  - "monitoring cronjob runs silently with empty stdout when there are no issues"
  - "monitoring discovers all deployed services and especially checks backend API services workers databases and provider managed dependencies"
  - "monitoring checks backend error counts high latency and CPU or memory usage above 90 percent as outage risk signals"
  - "alerts only on issues missing critical visibility or useful recovery and deduplicates repeated incident alerts"
  - "documents a short plain-language monitoring job name separately from its technical ID schedule script path state file monitored services metric sources thresholds and pause remove run instructions in the deployment monitoring runbook"
  - "verifies monitoring script healthy output is silent and simulated failure output is a concise alert"
  - "configures warning and critical latency alerts for core production backend journeys with p50 p95 p99 volume errors timeouts sustained windows minimum traffic or synthetic safeguards owned routing and recovery criteria"
  - "derives thresholds from the product latency objective or measured baseline rather than inventing one universal number and records a conservative provisional threshold plus a baseline task when neither exists"
  - "verifies routing with a safe test alert and records acknowledgement recovery and runbook evidence while treating missing production latency visibility as an operational gap"
  - "monitors the repository default branch and requires all required workflows and checks on the exact HEAD SHA rather than relying on an older or partial green run"
  - "derive the applicable default branch contract from workflow triggers and do not require PR-only checks on a post-merge push"
  - "treats terminal failures and missing required workflow check coverage as broken default branch CI while pending runs remain pending"
  - "must create or reuse one canonical GitHub issue with failed run and job URLs and must not create duplicate issues for repeated polls or reruns"
  - "must act immediately in the same run by continuing an existing worker or using a dedicated isolated worktree and a test-driven fix with bounded transient reruns"
  - "treats requested waiting pending queued and in progress as nonterminal and uses bounded fallback grace and runtime limits when the repository documents none"
  - "keeps the CI incident open despite any separate owner risk exception until exact default branch readback proves every applicable required workflow and check green"
  - "must verify the replacement run and all required workflows on the exact repaired or default branch SHA before closing the incident"
  - "for every production service plan includes a release-blocking metric collection regression task that proves emission transport retry collection ingestion storage aggregation destination reporting readback and missing malformed duplicate delayed or wrongly attributed signal detection"
setupCommands: []
teardownCommands: []
parameters:
  fixture: evaldata/README.md
