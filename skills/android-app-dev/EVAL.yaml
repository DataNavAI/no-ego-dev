prompt: |
  Use the android-app-dev skill to plan or execute a realistic Android app feature.
expectations:
  - "Uses self-review and appropriate automated checks by default, without dispatching a reviewer or waiting for independent approval."
  - "Uses a separate review only when the user explicitly requests it; never adds review-round or approval-receipt ceremony to ordinary work."
  - "Preserves user authorization, actual test/provider checks, secret protection and truthful completion evidence."
  - "requires PRD issue tech spec and UI guideline or feature UI brief before coding user-facing UI"
  - "blocks or creates a UI design follow-up when a UI-bearing feature lacks design artifacts"
  - "maps PRD acceptance criteria and UI states to Android implementation tasks"
  - "mentions relevant Android checks such as Gradle tests lint assemble or connected tests"
  - "requires emulator device preview screenshot or QA follow-up evidence for UI-bearing work"
  - "blocks Play Store internal testing publishing or release handoff until the Android app is installed and QA-smoked on an emulator with device API build artifact and pass fail evidence"
  - "considers Android accessibility lifecycle resources and release constraints when relevant"
  - "positive: Expo/EAS Android release identity and emulator QA traces non-secret variables to consumers and binds visible version identity through AAB installed QA and Play track readback"
  - "boundary/negative: must not retrieve secret values or assume date-based versionCode without an explicit collision-safe project policy"
setupCommands: []
teardownCommands: []
parameters:
  fixture: evaldata/README.md
