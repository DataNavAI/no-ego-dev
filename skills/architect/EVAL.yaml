prompt: |
  Use the architect skill to respond to a realistic client/project request.
expectations:
  - "mentions durable artifact"
  - "includes verification"
  - "avoids vague next steps"
  - "chooses or recommends the easiest-to-maintain viable hosting provider"
  - "adds product metrics instrumentation for user-facing products tied to PRD success metrics and the critical user journey"
  - "defines analytics events properties capture points dashboard or reporting path owner cadence and privacy constraints"
  - "researches cost effective analytics options and recommends an analytics tool/default or explicitly reuses adequate existing tooling"
  - "includes tests or QA checks for metrics firing correctly and not leaking private data"
  - "for browser or web game projects invokes web-game-dev during architecture to research compare and recommend a performant game engine"
  - "for web games documents game architecture patterns frame budget asset pipeline and engine-specific skill discovery or creation"
  - "considers MVP cost when recommending hosting"
  - "asks the user to choose only when provider tradeoffs materially affect cost, architecture, compliance, or access"
  - "ends each milestone or feature task breakdown with a scheduled refactoring task"
  - "refactoring task targets reducing complex dependencies removing redundant code improving testability and making product behavior verifiable by automated tests"
  - "delegates every technical design review to a fresh leaf subagent that loads technical-design-reviewer and never performs or supplements review judgment in the architect implementer or orchestrator context"
  - "uses a neutral exact revision and repository packet without private scratch reasoning hidden transcripts preferred architecture desired verdicts or summary substitution"
  - "requires structured technical findings with verdict severity evidence smallest correction integrity simplest alternative complexity ledger automatic testability operability self monitoring and missing decisions"
  - "reviews integrity across invariants contracts data state failures concurrency idempotency security migration rollout rollback and recovery"
  - "requires the simplest viable solution reuse of existing mechanisms and justification deletion conditions and operating cost for every new moving part"
  - "requires concrete automated tests and self monitoring whose telemetry alerts faults and recovery are themselves testable and fail closed"
  - "minimizes redundant code state services interfaces configuration dependencies and operational surfaces in the existing system"
  - "uses the automatically background delegate_task lifecycle without the deprecated background argument checkpoints exact spec revision round and REVIEW_PENDING and blocks handoff without fabricating approval"
  - "never lets user residual risk acceptance substitute for unavailable delegation pending missing malformed mismatched or blocked review or unresolved blocker high findings"
  - "defines callback continuation that saves findings records dispositions revises blocker high and accepted medium findings and sends the latest spec to a fresh reviewer"
  - "continues the revision state machine until the latest spec is approved or approved with minor notes with no unresolved blocker or high findings"
  - "bounds the technical revision gate to three review rounds detects stalled review and escalates unresolved decisions instead of self approving or handing off"
  - "saves technical review artifacts and identifies the exact tech spec revision reviewed"
  - "presents material technical specification Markdown through reviewable-artifacts and marks a temporary draft review PR REVIEW ONLY DO NOT MERGE in branch title body and available labels with cleanup ownership while preserving stable decision API data and risk anchors"
  - "reads human review threads updates and verifies the canonical specification replies with the addressing revision and resolves only addressed agreed comments"
  - "blocks coder and project manager handoff on unresolved material architecture comments and separates thread resolution spec approval and merge"
  - "after review preserves the accepted specification at its canonical destination closes the review only PR without merge and verifies cleanup of temporary branch worktree preview access and scratch resources"
setupCommands: []
teardownCommands: []
parameters:
  fixture: evaldata/README.md
