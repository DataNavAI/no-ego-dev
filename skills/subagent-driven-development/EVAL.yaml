prompt: Execute a six-task implementation plan using authorized implementation delegation. Tasks share a schema
  and UI brief; no two writers may race. The user requires one active implementation PR at a time and has not requested
  separate review. A worker times out after pushing a tested checkpoint. Explain ownership, real artifact inspection,
  self-review, tests, recovery, authorized merge and continuation. Also handle a one-line bug fix
  with delegation unavailable and a pure question about the fix. No real tracker or deployment
  mutations are required in this simulation.
expectations:
- Uses self-review and appropriate automated checks by default, without dispatching a reviewer or waiting for independent
  approval.
- Uses a separate review only when the user explicitly requests it; never adds review-round or approval-receipt
  ceremony to ordinary work.
- Preserves user authorization, actual test/provider checks, secret protection and truthful completion evidence.
- Records actionable development on the NED task board or explicitly chosen tracker before dispatching workers.
- Keeps user communication, monitoring and acceptance in the main session and delegates implementation even for the small fix.
- A delegated worker executes its assigned slice without recursively delegating it.
- Records unavailable delegation as a blocker and preserves the task for retry, without inline implementation.
- Answers the pure question without adding tasks or dispatching workers.
- Preserves one active implementation PR and non-overlapping writer ownership.
- Inspects actual remote artifacts and check results rather than trusting child completion.
- Recovers the existing checkpoint before retrying work.
- Performs self-review and integration checks without automatic reviewer dispatch.
setupCommands: []
teardownCommands: []
