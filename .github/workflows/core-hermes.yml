name: Core Hermes integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/ned-core/**'
      - 'src/**'
      - 'docs/features/core-orchestration/**'
      - 'scripts/test-core-hermes.mjs'
      - 'scripts/core-hermes-support.mjs'
      - 'package*.json'
      - '.github/workflows/core-hermes.yml'

permissions:
  contents: read

jobs:
  hermes-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.12.5
      - run: npm ci
      - name: Provision, exercise and tear down Hermes
        env:
          NED_HERMES_TEST_CACHE: ${{ runner.temp }}/ned-hermes-cache
          TMPDIR: ${{ runner.temp }}
          UV_PYTHON_DOWNLOADS: never
        run: npm run test:core:hermes
