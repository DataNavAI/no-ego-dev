name: Publish public NED container

on:
  workflow_run:
    workflows: [NED CLI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-ned-container
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/datanavai/no-ego-dev

jobs:
  verify-main:
    if: >-
      github.repository == 'DataNavAI/no-ego-dev' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      revision: ${{ steps.verify.outputs.revision }}
    steps:
      - name: Select exact verified main
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$TRIGGER_REVISION" =~ ^[a-f0-9]{40}$ ]]
          current="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [[ "$current" != "$TRIGGER_REVISION" ]]; then
            echo "A newer main revision has its own release run."
            exit 0
          fi
          for _ in {1..20}; do
            result="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$current&branch=main&event=push&per_page=50")"
            if jq -e --arg sha "$current" '
              [.workflow_runs[] | select(.head_sha==$sha)] as $runs |
              all(["NED CLI","Smoke test"][];
                . as $name | ($runs | map(select(.name==$name)) | max_by(.id)) |
                .status=="completed" and .conclusion=="success")
            ' <<<"$result" >/dev/null; then
              echo "revision=$current" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo "Exact main CLI and smoke verification did not pass."
          exit 1

  native-images:
    needs: verify-main
    if: needs.verify-main.outputs.revision != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.verify-main.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Build and qualify native image
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          REVISION: ${{ needs.verify-main.outputs.revision }}
        run: |
          set -euo pipefail
          tag="$IMAGE:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCHITECTURE"
          docker build --provenance=false --sbom=false --build-arg "NED_BUILD_REVISION=$REVISION" --tag "$tag" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$REVISION" .
          python docs/features/standalone-container/tests/container_acceptance.py \
            --image "$tag" --expected-architecture "$ARCHITECTURE"
      - name: Push the accepted native image
        env:
          GHCR_TOKEN: ${{ github.token }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCHITECTURE"

  release:
    needs: [verify-main, native-images]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Publish the revision and latest manifests
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ needs.verify-main.outputs.revision }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [[ "$current" != "$REVISION" ]]; then
            echo "A newer main revision has its own release run."
            exit 0
          fi
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create --tag "$IMAGE:$REVISION" --tag "$IMAGE:latest" \
            "$IMAGE:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-amd64" \
            "$IMAGE:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-arm64"
          docker buildx imagetools inspect --raw "$IMAGE:$REVISION" | jq -e '
            [.manifests[] | select(.platform.os=="linux") | .platform.architecture]
            | sort == ["amd64","arm64"]
          ' >/dev/null
          docker buildx imagetools inspect "$IMAGE:$REVISION"
