name: Native container acceptance

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'package*.json'
      - 'src/**'
      - 'bin/**'
      - 'scripts/container/**'
      - 'docs/features/standalone-container/**'
      - '.github/workflows/container-image.yml'
      - 'config.yaml'
      - 'distribution.yaml'
      - 'SOUL.md'
      - 'AGENTS.md'
      - 'skills/**'
      - 'eval_runner/**'
      - 'README*'
      - '.env.EXAMPLE'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: container (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Build and execute native image acceptance
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: python docs/features/standalone-container/tests/container_acceptance.py --expected-architecture "$EXPECTED_ARCHITECTURE"
