name: ned-hub-local
services:
  ned:
    build: .
    image: ned-standalone:hub
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: 1gb
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ned-operator
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${NED_DASHBOARD_PASSWORD:?Set NED_DASHBOARD_PASSWORD}
      HERMES_GATEWAY_BOOTSTRAP_STATE: running
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 127.0.0.1
      NED_ENV: staging
      NED_HUB_URL: https://staging.ned.datanav.app
      NED_INSTANCE_NAME: ${NED_INSTANCE_NAME:?Set a unique NED_INSTANCE_NAME}
      NED_HUB_TOKEN_FILE: /run/ned-hub-credentials/token
    secrets:
      - ned_hub_token
    volumes:
      - hermes-profile:/opt/data
      - ned-database:/var/lib/ned
      - projects:/projects
secrets:
  ned_hub_token:
    file: ${NED_HUB_TOKEN_PATH:?Set NED_HUB_TOKEN_PATH to an absolute private token file}
volumes:
  hermes-profile:
  ned-database:
  projects:
